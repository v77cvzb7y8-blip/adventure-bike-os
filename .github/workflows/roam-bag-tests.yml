name: ROAM Foundation 03 – Bag tests

on:
  pull_request:
    paths:
      - 'web-prototyp/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/roam-bag-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bag-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run ROAM bag browser tests
        run: npm test
